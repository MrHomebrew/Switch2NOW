name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'
      prerelease:
        description: 'Publish as prerelease?'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  switch1:
    name: Nintendo Switch 1 (.nro)
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install generator dependencies
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-jinja2 python3-jsonschema

      - name: Build SwitchNOW 1.3.0 NRO
        env:
          OPENNOW_BUILD_JOBS: "4"
          SWITCHNOW_VERSION: "1.3.0"
        run: bash scripts/build-switch-msys2.sh

      - name: Upload Switch 1 NRO
        uses: actions/upload-artifact@v4
        with:
          name: release-switch1-nro
          if-no-files-found: error
          path: build/switch/SwitchNOW.nro

  switch2:
    name: Nintendo Switch 2 (.nro)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: devkitpro/devkita64:20260219
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITA64: /opt/devkitpro/devkitA64
      OUNCE_DEVKIT_COMMIT: 0f38ba80d7ee768c5749278f127749d14ece2036
      OUNCE_DEVKIT_VERSION: '20261115'
      SWITCHNOW_VERSION: '1.3.0'

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure git safe directory & build tools
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils git cmake ninja-build python3 pkg-config make yasm

      - name: Prepare pinned Switch 2 SDK (ounce-devkit)
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/ounce-devkit"
          git init "$sdk"
          git -C "$sdk" fetch --depth=1 https://github.com/ouncebrew/ounce-devkit.git "$OUNCE_DEVKIT_COMMIT"
          git -C "$sdk" checkout --detach FETCH_HEAD
          test "$(git -C "$sdk" rev-parse HEAD)" = "$OUNCE_DEVKIT_COMMIT"
          bash "$sdk/install.sh" "$OUNCE_DEVKIT_VERSION"
          test -f "$DEVKITPRO/libounce/cmake/Switch2.cmake"
          test -f "$DEVKITPRO/portlibs/switch2/lib/libEGL.a"
          test -f "$DEVKITPRO/portlibs/switch/lib/libcurl.a"
          test -f "$DEVKITPRO/portlibs/switch/lib/libopus.a"

      - name: Verify Switch 2 package checker tests
        run: python3 -m unittest tests/test_switch2_package.py -v

      - name: Cache Switch 2 FFmpeg build
        uses: actions/cache@v4
        with:
          path: build/switch2/ffmpeg-install
          key: switch2-ffmpeg-v1-${{ hashFiles('scripts/build-switch2.sh', 'extern/ffmpeg/upstream/configure') }}

      - name: Build & verify SwitchNOW-switch2.nro
        env:
          OPENNOW_BUILD_JOBS: "4"
        run: bash scripts/build-switch2.sh

      - name: Upload Switch 2 NRO
        uses: actions/upload-artifact@v4
        with:
          name: release-switch2-nro
          if-no-files-found: error
          path: build/switch2/SwitchNOW-switch2.nro

  release:
    name: Publish GitHub Release
    needs: [switch1, switch2]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_staging
          merge-multiple: true

      - name: Prepare release metadata & checksums
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          cd release_staging
          test -s SwitchNOW.nro
          test -s SwitchNOW-switch2.nro
          sha256sum SwitchNOW.nro SwitchNOW-switch2.nro > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "SwitchNOW ${{ env.RELEASE_TAG }} (Switch 1 & Switch 2)"
          body: |
            ## Downloads
            - **Nintendo Switch 2**: `SwitchNOW-switch2.nro` (compatible with `hbmenu` / `ounce-hbmenu` and `kaiHEN`)
            - **Nintendo Switch 1**: `SwitchNOW.nro`
            - **Checksums**: `SHA256SUMS.txt`

            ## What's included
            - Native **Nintendo Switch 2** port using `ounce-devkit` / `libounce` / `OunceVK` (OpenGL ES 3.0 UI via Borealis & `GLVideoRenderer`, hardware H.264 decoding via `viddec` with software FFmpeg fallback, `libopus` + `audout` audio).
            - Added **Português (Brasil)** (`pt-BR`) UI localization (available in `Settings > Interface > Language`).

            ## Credits
            - **Original project (`SwitchNOW`)**: [Blade-Punisher](https://github.com/Blade-Punisher)
            - **Nintendo Switch 2 port & `pt-BR` translation**: [David Kalil Braga (@davidkalil10)](https://github.com/davidkalil10)
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == true }}
          files: |
            release_staging/SwitchNOW.nro
            release_staging/SwitchNOW-switch2.nro
            release_staging/SHA256SUMS.txt
